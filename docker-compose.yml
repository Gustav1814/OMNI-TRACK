# OmniTrack AI — local infrastructure only (PostgreSQL + pgvector, Redis)
# Run: docker compose up -d
# The backend and frontend run from the terminal; see README.md "Quick Start".

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnitrack-db
    environment:
      POSTGRES_USER: omnitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnitrack_secret}  # only used when the volume is first created
      POSTGRES_DB: omnitrack_db
    ports:
      - "5432:5432"
    volumes:
      - omnitrack_pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=200
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=16MB
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitrack -d omnitrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnitrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  omnitrack_pgdata:
