# OmniTrack AI — Full Stack (Industry-Standard Prototype)
# Run: docker compose up -d
# Dashboard: http://localhost (via nginx) or http://localhost:5173 (frontend dev)
# API: http://localhost:8000 | Docs: http://localhost:8000/docs

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnitrack-db
    environment:
      POSTGRES_USER: omnitrack
      POSTGRES_PASSWORD: omnitrack_secret
      POSTGRES_DB: omnitrack_db
    ports:
      - "5432:5432"
    volumes:
      - omnitrack_pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=200
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=16MB
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitrack -d omnitrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnitrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnitrack-api
    environment:
      DATABASE_URL: postgresql+asyncpg://omnitrack:omnitrack_secret@postgres:5432/omnitrack_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173","http://frontend"]'
      DB_RUN_MIGRATIONS_ON_STARTUP: "false"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-8}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-4}"
      DB_CREATE_FUTURE_PARTITIONS_ON_STARTUP: "${DB_CREATE_FUTURE_PARTITIONS_ON_STARTUP:-true}"
      DB_PARTITION_MONTHS_AHEAD: "${DB_PARTITION_MONTHS_AHEAD:-3}"
      MODEL_WEIGHTS_DIR: /app/model_weight
      FOOTAGE_DIR: /app/storage/footage
      EXPORT_DIR: /app/exports
      ENABLED_PLUGINS: '${ENABLED_PLUGINS:-[]}'
      PROCESSING_FPS: "${PROCESSING_FPS:-15}"
      MAX_CAMERAS: "${MAX_CAMERAS:-16}"
      FRAME_BUFFER_SIZE: "${FRAME_BUFFER_SIZE:-2}"
      DEFAULT_SKIP_FRAMES: "${DEFAULT_SKIP_FRAMES:-1}"
      MAX_CPU_WORKERS: "${MAX_CPU_WORKERS:-4}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-1}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/model_weight:/app/model_weight
      - ./backend/storage:/app/storage
      - ./backend/exports:/app/exports
    shm_size: "1gb"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
    container_name: omnitrack-dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Optional: single entrypoint reverse proxy (production-style)
  nginx:
    image: nginx:alpine
    container_name: omnitrack-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - with-nginx

volumes:
  omnitrack_pgdata:
