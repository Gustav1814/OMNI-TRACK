name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff F + fast pytest, CPU torch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "2"
      ALLOW_MOCK_AI: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Lint (pyflakes rules only)
        run: uvx ruff check --isolated --select F backend/app backend/tests backend/scripts eval

      - name: Install dependencies (CPU torch)
        working-directory: backend
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          uv pip install --python .venv/bin/python pytest

      - name: Tests (not slow; gpu/db tests auto-skip)
        working-directory: backend
        run: .venv/bin/python -m pytest -m "not slow" -q

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
