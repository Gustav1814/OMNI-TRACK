[pytest]
# OmniTrack backend test configuration.
#   Fast CI suite:   pytest -m "not slow"
#   Everything:      pytest
# Tests live in backend/tests/test_<area>_*.py and must be self-contained
# (no running server, no network). Tests that need Postgres/Redis must skip
# cleanly when the service is unreachable.
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    slow: loads ML models, decodes video or touches large data (excluded from CI: -m "not slow")
    gpu: requires a CUDA device (auto-skipped when none is available)
    db: requires a reachable PostgreSQL (auto-skipped when unreachable)
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
